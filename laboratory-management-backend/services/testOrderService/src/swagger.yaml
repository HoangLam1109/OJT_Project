# ./services/testOrderService/src/swagger.yaml
openapi: 3.0.3
info:
  title: TestOrder Service API
  version: 1.0.0
  description: API cho dịch vụ Test Order
servers:
  - url: http://localhost:5002/api
    description: Local server

paths:
  /testOrder/create:
    post:
      summary: Tạo Test Order mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestOrderRequest'
            examples:
              default:
                summary: Ví dụ tạo order
                value:
                  patient_id: "7010eeed-bf3c-4152-b9b0-4eea6838c5d5"
                  patient_name: "Lu Khang"
                  barcode: "BC98765"
                  status: "Pending"
                  test_type: "Vi sinh"
                  created_by: "usr_001"
                  updated_by: "usr_001"
                  instrument_id: "57ed2161-5913-4bc3-bd9d-2d775477cf43"
                  reagent_usages: 
                    - reagent_id: "R001"
                      quantity_used: 34
                    - reagent_id: "R002"
                      quantity_used: 30
                  due_date: "2025-10-30T10:00:00.000Z"
                  is_deleted: false
                  deleted_at: null
                  deleted_by: null
                  notes: "Có thêm ghi chú nếu cần"
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/TestOrderResponse'
        '400':
          description: Lỗi dữ liệu đầu vào

  # ==================== GET: Lấy tất cả ====================
  /testOrder/all:
    get:
      summary: Lấy danh sách Test Orders (có phân trang)
      description: |
        Lấy danh sách tất cả Test Orders chưa bị xóa mềm (is_deleted = false).
        Hỗ trợ phân trang qua query params `page` và `limit`.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            example: 1
          description: Trang hiện tại (mặc định = 1)
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
          description: Số bản ghi mỗi trang (mặc định = 10)
      responses:
        '200':
          description: Danh sách Test Orders kèm thông tin phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "6730f41e5b9010f80bfcf69a"
                        patient_id:
                          type: string
                          example: "P001"
                        patient_name:
                          type: string
                          example: "Nguyễn Văn A"
                        barcode:
                          type: string
                          example: "BR123456"
                        status:
                          type: string
                          example: "Pending"
                        test_type:
                          type: string
                          example: "Blood Test"
                        notes:
                          type: string
                          example: "Cần xử lý sớm"
                        created_at:
                          type: string
                          format: date-time
                          example: "2025-11-10T10:30:00.000Z"
                        updated_at:
                          type: string
                          format: date-time
                          example: "2025-11-10T12:00:00.000Z"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 42
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 5
        '500':
          description: Lỗi server nội bộ

    # ==================== GET: Search Test Orders ====================
  /testOrder/search:
    get:
      summary: Tìm kiếm Test Orders theo từ khóa
      description: |
        Tìm kiếm Test Orders theo từ khóa (`keyword`) khớp với tên bệnh nhân, barcode, hoặc loại xét nghiệm.  
        Có thể kết hợp phân trang bằng query `page` và `limit`.
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
          required: true
          description: Từ khóa cần tìm kiếm ( tên bệnh nhân hoặc barcode)
          example: "Khang"
        - in: query
          name: page
          schema:
            type: integer
            example: 1
          description: Trang hiện tại (mặc định = 1)
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
          description: Số bản ghi mỗi trang (mặc định = 10)
      responses:
        '400':
          description: Thiếu hoặc sai định dạng query parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Keyword is required"
        '500':
          description: Lỗi server

 # ==================== GET: Lấy tất cả ====================
  /testOrder/result:
    get:
      summary: Lấy danh sách kết quả tất cả Test Orders Result
      responses:
        '200':
          description: Danh sách Test Orders Result
        '500':
          description: Lỗi server

  # ==================== GET: Lấy theo ID ====================
  /testOrder/{id}:
    get:
      summary: Lấy Test Order theo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của Test Order
          example: "ord_123"
      responses:
        '200':
          description: Test Order tìm thấy
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Test order not found"
        '500':
          description: Lỗi server

  # ==================== PUT: Cập nhật Test Order ====================
  /testOrder/update/{id}:
    put:
      summary: Cập nhật thông tin Test Order
      description: Cập nhật dữ liệu của một Test Order dựa trên ID (lấy từ URL). Chỉ cập nhật các bản ghi có isDeleted = false.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID của Test Order cần cập nhật
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTestOrderRequest'
            examples:
              default:
                summary: Ví dụ cập nhật Test Order
                value:
                   patient_name: "Lu Khang"
                   barcode: "BC98765"
                   status: "Pending"
                   test_type: "Vi sinh"
                   created_by: "usr_001"
                   updated_by: "usr_001"
                   instrument_id: "57ed2161-5913-4bc3-bd9d-2d775477cf43"
                   reagent_usages: 
                    - reagent_id: "R001"
                      quantity_used: 34
                    - reagent_id: "R002"
                      quantity_used: 30
                   due_date: "2025-10-30T10:00:00.000Z"
                   is_deleted: false
                   deleted_at: null
                   deleted_by: null
                   notes: "Có thêm ghi chú nếu cần"
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestOrder'
        '404':
          description: Không tìm thấy Test Order hoặc đã bị xóa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Test order not found or deleted"
        '500':
          description: Lỗi server


# ==================== DELETE: Soft Delete Test Order ====================
  /testOrder/delete/{id}:
    delete:
      summary: Xóa mềm (soft delete) một Test Order
      description: |
        Thực hiện xóa mềm cho Test Order theo ID. 
        Nếu trạng thái order chưa Completed, sẽ hồi lại tồn kho reagent.
        Chỉ cập nhật các bản ghi có isDeleted = false.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của Test Order cần xóa
      requestBody:
        description: Thông tin người thực hiện xóa
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deleted_by
              properties:
                deleted_by:
                  type: string
                  description: ID người thực hiện xóa
                  example: "usr_002"
      responses:
        '200':
          description: Xóa thành công, trả về thông tin order đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestOrder'
        '404':
          description: Không tìm thấy order
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Test order not found"
        '500':
          description: Lỗi server

components:
  schemas:
    # ==================== REQUEST: Dữ liệu gửi lên ====================
    CreateTestOrderRequest:
      type: object
      required:
        - patient_id
      properties:
        patient_id:
          type: string
          description: ID bệnh nhân
          example: "pat_123"
        barcode:
          type: string
          description: Mã vạch (tự sinh nếu không gửi)
          example: "BC98765"

    # ==================== RESPONSE: TestOrder trả về ====================
    TestOrder:
      type: object
      required:
        - id
        - patient_id
        - barcode
        - status
        - created_at
        - created_by
        - updated_at
        - updated_by
        - is_deleted
        - deleted_at
        - deleted_by
      properties:
        id:
          type: string
          example: "ord_123"
        patient_id:
          type: string
          example: "pat_123"
        barcode:
          type: string
          example: "BC98765"
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
          example: "pending"
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
        is_deleted:
          type: boolean
          example: false
        deleted_at:
          type: string
          format: date-time
          nullable: true

        deleted_by:
          type: string

          
    UpdateTestOrderRequest:
      type: object
      description: Dữ liệu cần cập nhật cho Test Order
      properties:
        id:
          type: string
          example: "68f89ca5abc36901ef4d6fd1"
        patient_id:
          type: string
          example: "9f886139-ebf3-4b22-a277-4384de12bfab"
        barcode:
          type: string
          example: "BC98765"
        status:
          type: string
          description: Trạng thái mới của order
          enum: [pending, processing, completed, cancelled]
          example: "processing"
        run_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-10-31T10:00:00.000Z"
        run_by:
          type: string
          example: "usr_002"
        created_at:
          type: string
          format: date-time
          example: "2025-10-30T10:00:00.000Z"
        created_by:
          type: string
          example: "usr_001"
        updated_at:
          type: string
          format: date-time
          example: "2025-10-31T10:05:00.000Z"
        updated_by:
          type: string
          example: "usr_001"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        deleted_by:
          type: string
          example: null
        is_deleted:
          type: boolean
          example: false
